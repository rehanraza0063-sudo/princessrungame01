<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Princess Run</title>
<style>
  html,body{margin:0;height:100%;background:#120a24;overflow:hidden;touch-action:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{height:min(100vh,calc(100vw*800/480));aspect-ratio:480/800;background:#000;box-shadow:0 0 40px #0008}
</style>
</head>
<body>
<canvas id="c" width="480" height="800"></canvas>
<script>
/* ===================== PRINCESS RUN =====================
   Controls: Left/Right (A/D) change lane, Up/W/Space jump, Down/S dive (slide)
   Touch: swipe left/right/up/down, tap to start. M = mute.
   Original characters: a princess and a police officer chasing her.
========================================================== */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=480,H=800,HOR=230,GY=600,LANE=125,F=260,ZFAR=1700;
let state='menu',score=0,coins=0,speed=520,dist=0,obs=[],gap=1,spawnT=0,shake=0,time=0,runPh=0;
let best=+(localStorage.getItem('princessRunBest')||0),muted=false,shoutT=6,overT=0;
const player={lane:1,x:0,y:0,vy:0,slide:0};

/* ---------------- AUDIO ---------------- */
let AC,master,musicGain,sfxGain,noiseBuf;
function initAudio(){
  if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=muted?0:.85;master.connect(AC.destination);
  musicGain=AC.createGain();musicGain.gain.value=.22;musicGain.connect(master);
  sfxGain=AC.createGain();sfxGain.gain.value=.8;sfxGain.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  startMusic();
}
function tone(type,f1,f2,dur,vol,dest,delay){
  if(!AC)return;delay=delay||0;
  const s=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,s);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),s+dur);
  g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.001,s+dur);
  o.connect(g);g.connect(dest||sfxGain);o.start(s);o.stop(s+dur+.02);
}
function noise(dur,vol,fHi,fLo,delay,dest){
  if(!AC)return;delay=delay||0;
  const s=AC.currentTime+delay,src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  src.buffer=noiseBuf;f.type='lowpass';
  f.frequency.setValueAtTime(fHi,s);f.frequency.exponentialRampToValueAtTime(Math.max(20,fLo),s+dur);
  g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.001,s+dur);
  src.connect(f);f.connect(g);g.connect(dest||sfxGain);src.start(s);src.stop(s+dur+.02);
}
/* formant "voice": saw wave through band-pass filters, sounds like a vowel */
function voice(f0,f1,dur,formants,vol,delay){
  if(!AC)return;delay=delay||0;
  const s=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(f0,s);o.frequency.linearRampToValueAtTime(f1,s+dur);
  lfo.frequency.value=7;lg.gain.value=f0*.03;lfo.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.03);g.gain.linearRampToValueAtTime(0,s+dur);
  formants.forEach(fm=>{const b=AC.createBiquadFilter();b.type='bandpass';b.frequency.value=fm;b.Q.value=7;o.connect(b);b.connect(g);});
  g.connect(sfxGain);o.start(s);lfo.start(s);o.stop(s+dur+.05);lfo.stop(s+dur+.05);
}
function say(text,pitch,rate){
  if(muted)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.pitch=pitch;u.rate=rate;u.volume=.9;speechSynthesis.speak(u);}catch(e){}
}
const SFX={
  jump(){tone('square',280,760,.18,.22);voice(520,760,.22,[900,1500],1.1);},
  dive(){tone('sawtooth',650,110,.28,.18);noise(.25,.25,3500,400);voice(480,340,.16,[700,1100],1);},
  coin(){tone('square',988,988,.07,.12);tone('square',1319,1319,.12,.12,null,.07);},
  crash(){noise(.7,.9,2200,80);tone('sawtooth',170,35,.6,.5);voice(760,1050,.45,[420,2300],1.2,.05);},
  officerGrowl(){voice(120,75,.55,[600,950],1.7);noise(.4,.2,900,150);},
  officerShout(){voice(130,95,.45,[700,1100],1.8);},
  officerLaugh(){for(let i=0;i<4;i++)voice(105,88,.16,[500,900],1.6,i*.24);},
  princessCheer(){voice(600,900,.3,[800,1300],1.1);voice(700,1100,.3,[800,1300],1.1,.2);}
};
/* background music: 8th-note step sequencer, A minor groove */
const SC=[0,3,5,7,10,12,15,17];
const mtof=n=>440*Math.pow(2,(n-69)/12);
const ROOTS=[45,41,48,43];
const LEAD=[0,-1,2,-1,4,2,-1,3, 5,-1,4,2,-1,0,2,-1, 0,-1,2,-1,4,5,-1,7, 6,5,4,-1,2,-1,0,-1];
let nextT=0,step=0,musicTimer=null;
function playStep(st,t){
  const bar=Math.floor(st/8)%4,root=ROOTS[bar],k=st%8;
  const dly=t-AC.currentTime;
  if(k%2===0) tone('triangle',mtof(root-12),mtof(root-12)*.98,.22,.55,musicGain,dly);
  if(k%4===0){tone('sine',160,40,.16,.8,musicGain,dly);}
  if(k%2===1) noise(.05,.18,9000,4000,dly,musicGain);
  const arp=[0,7,12,7][k%4];
  tone('square',mtof(root+12+arp),mtof(root+12+arp),.1,.07,musicGain,dly);
  const li=LEAD[st%32];
  if(li>=0){const n=69+SC[li%SC.length]; tone('sawtooth',mtof(n),mtof(n),.2,.1,musicGain,dly);}
}
function startMusic(){
  nextT=AC.currentTime+.1;
  musicTimer=setInterval(()=>{
    while(nextT<AC.currentTime+.25){playStep(step,nextT);nextT+=60/150/2;step++;}
  },60);
}
function toggleMute(){
  muted=!muted;if(master)master.gain.value=muted?0:.85;
  if(muted){try{speechSynthesis.cancel();}catch(e){}}
}

/* ---------------- GAME LOGIC ---------------- */
function reset(){
  obs=[];score=0;coins=0;speed=520;dist=0;gap=1;spawnT=0;shake=0;shoutT=6;
  player.lane=1;player.x=0;player.y=0;player.vy=0;player.slide=0;
}
function start(){
  initAudio();reset();state='play';
  say('Catch me if you can!',2,1.1);
  setTimeout(()=>{if(state==='play'){SFX.officerShout();say('Stop right there, princess!',0.2,0.85);}},1500);
}
function jump(){
  if(state!=='play')return;
  if(player.y<=0.5){player.vy=980;player.slide=0;SFX.jump();}
}
function dive(){
  if(state!=='play')return;
  if(player.y>0.5){player.vy=-1500;}
  player.slide=.65;SFX.dive();
}
function moveLane(d){
  if(state!=='play')return;
  const n=Math.max(0,Math.min(2,player.lane+d));
  if(n!==player.lane){player.lane=n;tone('triangle',400,600,.08,.12);}
}
function spawnRow(){
  const z=ZFAR,free=Math.floor(Math.random()*3);
  for(let l=0;l<3;l++){
    if(l===free){
      if(Math.random()<.7){const n=3+Math.floor(Math.random()*4);for(let i=0;i<n;i++)obs.push({type:'coin',lane:l,z:z+i*70,hit:false});}
      continue;
    }
    if(Math.random()<.65){
      const r=Math.random();
      const type=r<.4?'low':r<.7?'high':'block';
      obs.push({type,lane:l,z,hit:false,depth:type==='block'?280:24,col:Math.floor(Math.random()*3)});
    }
  }
}
function stumble(heavy){
  shake=.35;SFX.crash();
  gap-=heavy?.65:.5;
  if(gap<=.05){gameOver();return;}
  setTimeout(()=>{if(state==='play')SFX.officerGrowl();},250);
}
function gameOver(){
  gap=0;state='over';overT=0;
  if(score>best){best=score;try{localStorage.setItem('princessRunBest',best);}catch(e){}}
  setTimeout(()=>{SFX.officerLaugh();say('Gotcha! You are under arrest!',0.15,0.8);},350);
}
function update(dt){
  time+=dt;
  if(state==='play'){
    speed=Math.min(1150,520+dist/55);
    dist+=speed*dt;score=Math.floor(dist/60)+coins*5;
    runPh+=dt*speed*.016;
    gap=Math.min(1,gap+dt*.04);
    // physics
    player.y+=player.vy*dt;player.vy-=2700*dt;
    if(player.y<=0){player.y=0;player.vy=0;}
    if(player.slide>0)player.slide-=dt;
    player.x+=((player.lane-1)*LANE-player.x)*Math.min(1,dt*14);
    // spawn
    spawnT-=speed*dt;
    if(spawnT<=0){spawnRow();spawnT=380+Math.random()*260;}
    // objects
    for(const o of obs){
      o.z-=speed*dt;
      if(o.hit)continue;
      const ox=(o.lane-1)*LANE;
      if(Math.abs(ox-player.x)>LANE*.42)continue;
      const dep=o.depth||0;
      if(!(o.z<30&&o.z+dep>-30))continue;
      if(o.type==='coin'){
        if(player.y<110){o.hit=true;coins++;SFX.coin();}
      }else if(o.type==='low'){ if(player.y<48){o.hit=true;stumble(false);} }
      else if(o.type==='high'){ if(player.slide<=0&&player.y<105){o.hit=true;stumble(false);} }
      else if(o.type==='block'){ if(player.y<235){o.hit=true;stumble(true);} }
    }
    obs=obs.filter(o=>o.z>-120&&!(o.type==='coin'&&o.hit));
    // officer shouts
    shoutT-=dt;
    if(shoutT<=0){shoutT=7+Math.random()*5;if(gap<.8){SFX.officerShout();say(Math.random()<.5?'Halt!':'Get back here!',0.2,.9);}}
    if(score>0&&score%250===0&&!update.cheered){update.cheered=true;SFX.princessCheer();}
    if(score%250!==0)update.cheered=false;
  }else if(state==='over'){overT+=dt;}
  else{runPh+=dt*6;}
  if(shake>0)shake-=dt;
}

/* ---------------- RENDERING ---------------- */
function P(wx,wy,z){const s=F/(z+F);return[W/2+wx*s,HOR+(GY-HOR)*s-wy*s,s];}
function poly(pts,col){ctx.fillStyle=col;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=(n>>16)*f,g=((n>>8)&255)*f,b=(n&255)*f;return`rgb(${Math.min(255,r|0)},${Math.min(255,g|0)},${Math.min(255,b|0)})`;}
function box(x0,x1,y0,y1,z0,z1,col){
  if(z0<-F+20)return;
  const a=P(x0,y1,z0),b=P(x1,y1,z0),c=P(x1,y0,z0),d=P(x0,y0,z0);
  const e=P(x0,y1,z1),f=P(x1,y1,z1),g=P(x1,y0,z1),h=P(x0,y0,z1);
  if(x1<0)poly([b,f,g,c],shade(col,.6));
  if(x0>0)poly([a,e,h,d],shade(col,.6));
  poly([a,b,f,e],shade(col,1.25));
  poly([a,b,c,d],col);
}
const skyline=[];for(let i=0,x=0;x<1100;i++){const w=40+Math.random()*60;skyline.push({x,w,h:40+Math.random()*110,c:i%2});x+=w+4;}
function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,HOR+40);
  g.addColorStop(0,'#2b1055');g.addColorStop(.55,'#c0407e');g.addColorStop(1,'#ffb36b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HOR+60);
  ctx.fillStyle='#ffe9a8';ctx.beginPath();ctx.arc(330,HOR-30,46,0,7);ctx.fill();
  // stars
  ctx.fillStyle='#fff8';for(let i=0;i<30;i++){ctx.fillRect((i*97)%W,(i*53)%110,2,2);}
  // skyline parallax
  const off=(dist*.02)%1100;
  for(let k=0;k<2;k++)for(const b of skyline){
    const x=b.x-off+k*1100;if(x<-120||x>W+10)continue;
    ctx.fillStyle=b.c?'#3a1d5e':'#2e1650';ctx.fillRect(x,HOR+4-b.h,b.w,b.h);
    ctx.fillStyle='#ffd77a88';
    for(let wy=HOR-b.h+10;wy<HOR-6;wy+=16)for(let wx=x+6;wx<x+b.w-8;wx+=14)if(((wx*7+wy*3)|0)%5<2)ctx.fillRect(wx,wy,5,7);
  }
  // ground base
  ctx.fillStyle='#2a1b3d';ctx.fillRect(0,HOR+4,W,H);
}
function drawRoad(){
  const near=-F+40;
  const road=[P(-195,0,ZFAR),P(195,0,ZFAR),P(195,0,near),P(-195,0,near)];
  poly([P(-330,0,ZFAR),P(330,0,ZFAR),P(330,0,near),P(-330,0,near)],'#4a3566');
  poly(road,'#54506a');
  // cross stripes
  const sp=140,o=dist%sp;
  for(let z=-o;z<ZFAR;z+=sp){
    if(z<near)continue;
    poly([P(-195,0,z),P(195,0,z),P(195,0,z+16),P(-195,0,z+16)],'#5f5a78');
  }
  // lane dividers
  for(let z=-(dist%120);z<ZFAR;z+=120){
    for(const x of[-62.5,62.5])poly([P(x-3,0,z),P(x+3,0,z),P(x+3,0,z+60),P(x-3,0,z+60)],'#e8e0ff');
  }
  poly([P(-198,0,ZFAR),P(-190,0,ZFAR),P(-190,0,near),P(-198,0,near)],'#ffcf5a');
  poly([P(190,0,ZFAR),P(198,0,ZFAR),P(198,0,near),P(190,0,near)],'#ffcf5a');
  // lamp posts
  const ls=320,lo=dist%ls;
  const lamps=[];
  for(let z=-lo;z<ZFAR;z+=ls){if(z<near)continue;lamps.push(z);}
  for(const z of lamps.reverse()){
    for(const sx of[-1,1]){
      const bx=sx*260;
      box(bx-5,bx+5,0,150,z,z+10,'#3b2b55');
      const t=P(bx,150,z),l=P(bx-sx*30,150,z);
      ctx.strokeStyle='#3b2b55';ctx.lineWidth=4*t[2];ctx.beginPath();ctx.moveTo(t[0],t[1]);ctx.lineTo(l[0],l[1]);ctx.stroke();
      ctx.fillStyle='#ffe38a';ctx.beginPath();ctx.arc(l[0],l[1],7*t[2],0,7);ctx.fill();
    }
  }
}
const BLOCKCOL=['#4f7cff','#2fb59a','#c26bd8'];
function drawObj(o){
  const x=(o.lane-1)*LANE;
  ctx.globalAlpha=Math.max(0,Math.min(1,(ZFAR-o.z)/350));
  if(o.type==='coin'){
    const[sx,sy,s]=P(x,38,o.z),sq=Math.abs(Math.cos(time*5+o.z*.01));
    ctx.fillStyle='#ffc61a';ctx.beginPath();ctx.ellipse(sx,sy,18*s*(.25+.75*sq),18*s,0,0,7);ctx.fill();
    ctx.fillStyle='#fff3a0';ctx.beginPath();ctx.ellipse(sx,sy,9*s*(.25+.75*sq),10*s,0,0,7);ctx.fill();
  }else if(o.type==='low'){
    box(x-55,x+55,0,48,o.z,o.z+24,'#e84a5f');
    const a=P(x-55,48,o.z),b=P(x+55,48,o.z),c=P(x+55,20,o.z),d=P(x-55,20,o.z);
    poly([a,b,c,d],'#fff');
    for(let i=0;i<6;i++){const u=x-55+i*20;poly([P(u,48,o.z),P(u+10,48,o.z),P(u+10,20,o.z),P(u,20,o.z)],'#e84a5f');}
  }else if(o.type==='high'){
    box(x-60,x-48,0,110,o.z,o.z+16,'#7a6a99');
    box(x+48,x+60,0,110,o.z,o.z+16,'#7a6a99');
    box(x-60,x+60,62,100,o.z,o.z+16,'#ffb02e');
    const a=P(x-60,100,o.z),b=P(x+60,100,o.z),c=P(x+60,62,o.z),d=P(x-60,62,o.z);
    ctx.save();ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.clip();
    ctx.fillStyle='#222';for(let i=-6;i<8;i++){const p=P(x-60+i*24,100,o.z),q=P(x-36+i*24,100,o.z),r=P(x-48+i*24,62,o.z),t=P(x-72+i*24,62,o.z);poly([p,q,r,t],'#222');}
    ctx.restore();
  }else{
    const c=BLOCKCOL[o.col];
    box(x-52,x+52,0,235,o.z,o.z+o.depth,c);
    for(let r=0;r<2;r++)for(let k=0;k<2;k++){
      const wx=x-38+k*48,wy=150-r*65;
      poly([P(wx,wy+40,o.z),P(wx+30,wy+40,o.z),P(wx+30,wy,o.z),P(wx,wy,o.z)],'#ffeaa0');
    }
    poly([P(x-52,20,o.z),P(x+52,20,o.z),P(x+52,10,o.z),P(x-52,10,o.z)],'#ffffff55');
  }
  ctx.globalAlpha=1;
}
function drawPrincess(x,y,s,ph,air,slide){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  if(!air){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,0,32,8,0,0,7);ctx.fill();}
  if(slide)ctx.scale(1.15,.6);
  const sw=air?10:Math.sin(ph)*16,sk='#ffd9b8';
  ctx.lineCap='round';
  // ponytail
  ctx.fillStyle='#8a52e8';ctx.beginPath();ctx.moveTo(4,-100);
  ctx.quadraticCurveTo(-30+Math.sin(ph*.7)*10,-72,-14+Math.sin(ph)*12,-28);
  ctx.quadraticCurveTo(10,-62,10,-92);ctx.fill();
  // legs
  ctx.strokeStyle=sk;ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(-7,-44);ctx.lineTo(-7+sw,-7);ctx.moveTo(7,-44);ctx.lineTo(7-sw,-7);ctx.stroke();
  ctx.fillStyle='#e0457b';ctx.beginPath();ctx.ellipse(-7+sw,-4,8,5,0,0,7);ctx.ellipse(7-sw,-4,8,5,0,0,7);ctx.fill();
  // arms
  ctx.strokeStyle=sk;ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(-13,-76);ctx.lineTo(-20-sw*.5,-56);ctx.moveTo(13,-76);ctx.lineTo(20+sw*.5,-56);ctx.stroke();
  // gown
  ctx.fillStyle='#4cc3ff';ctx.beginPath();ctx.moveTo(-14,-80);ctx.lineTo(14,-80);ctx.lineTo(32,-38);
  ctx.quadraticCurveTo(0,-30,-32,-38);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-32,-38);ctx.quadraticCurveTo(0,-30,32,-38);ctx.stroke();
  ctx.fillStyle='#ffc61a';ctx.fillRect(-14,-68,28,6);
  ctx.fillStyle='#ff6fa5';ctx.beginPath();ctx.arc(0,-65,5,0,7);ctx.fill();
  // head (back view = hair)
  ctx.fillStyle='#8a52e8';ctx.beginPath();ctx.arc(0,-94,17,0,7);ctx.fill();
  ctx.fillStyle='#a56bff';ctx.beginPath();ctx.arc(-5,-99,8,0,7);ctx.fill();
  ctx.fillStyle='#ff6fa5';ctx.beginPath();ctx.arc(6,-100,5,0,7);ctx.fill();
  // crown
  ctx.fillStyle='#ffc61a';ctx.beginPath();
  ctx.moveTo(-12,-106);ctx.lineTo(-12,-120);ctx.lineTo(-6,-113);ctx.lineTo(0,-123);ctx.lineTo(6,-113);ctx.lineTo(12,-120);ctx.lineTo(12,-106);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff4d6d';ctx.beginPath();ctx.arc(0,-110,2.5,0,7);ctx.fill();
  ctx.restore();
}
function drawOfficer(x,y,s,ph,angry){
  ctx.save();ctx.translate(x,y);ctx.scale(s*1.1,s*1.1);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,0,48,11,0,0,7);ctx.fill();
  const sw=Math.sin(ph)*18;
  ctx.lineCap='round';
  // legs
  ctx.strokeStyle='#14203d';ctx.lineWidth=17;
  ctx.beginPath();ctx.moveTo(-14,-72);ctx.lineTo(-14+sw,-10);ctx.moveTo(14,-72);ctx.lineTo(14-sw,-10);ctx.stroke();
  ctx.fillStyle='#0b0f1a';ctx.beginPath();ctx.ellipse(-14+sw,-6,13,7,0,0,7);ctx.ellipse(14-sw,-6,13,7,0,0,7);ctx.fill();
  // torso
  ctx.fillStyle='#1f3566';ctx.beginPath();ctx.roundRect(-40,-138,80,72,12);ctx.fill();
  ctx.fillStyle='#16264a';ctx.fillRect(-1.5,-136,3,68);
  ctx.fillStyle='#e8c24a';ctx.fillRect(-40,-72,80,8);
  ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText('POLICE',0,-100);
  // epaulettes
  ctx.fillStyle='#e8c24a';ctx.beginPath();ctx.arc(-42,-132,9,0,7);ctx.arc(42,-132,9,0,7);ctx.fill();
  // arms
  ctx.strokeStyle='#1f3566';ctx.lineWidth=17;
  const armL=-sw*.8,armR=sw*.8;
  ctx.beginPath();ctx.moveTo(-44,-126);ctx.lineTo(-54,-92+armL*.5);ctx.moveTo(44,-126);ctx.lineTo(58+armR*.4,-96-Math.abs(armR)*.8);ctx.stroke();
  ctx.fillStyle='#d9a07a';ctx.beginPath();ctx.arc(-54,-86+armL*.5,9,0,7);ctx.arc(58+armR*.4,-102-Math.abs(armR)*.8,9,0,7);ctx.fill();
  // baton
  ctx.strokeStyle='#222';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(58+armR*.4,-102-Math.abs(armR)*.8);ctx.lineTo(80+armR*.4,-140-Math.abs(armR));ctx.stroke();
  // neck & head
  ctx.fillStyle='#d9a07a';ctx.fillRect(-9,-152,18,16);
  ctx.beginPath();ctx.arc(0,-160,19,0,7);ctx.fill();
  ctx.fillStyle='#3b2a1a';ctx.beginPath();ctx.arc(0,-157,19,.1*Math.PI,.9*Math.PI);ctx.fill();
  // cap
  ctx.fillStyle='#1f3566';ctx.beginPath();ctx.ellipse(0,-174,26,12,0,0,7);ctx.fill();
  ctx.fillStyle='#c0243a';ctx.fillRect(-24,-174,48,6);
  ctx.fillStyle='#16264a';ctx.beginPath();ctx.ellipse(0,-180,20,9,0,0,7);ctx.fill();
  if(angry){ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.fillText('!',34,-186);}
  ctx.restore();
}
function drawHUD(){
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';
  ctx.shadowColor='#000a';ctx.shadowBlur=6;
  ctx.fillText(score,16,40);
  ctx.fillStyle='#ffc61a';ctx.beginPath();ctx.arc(26,62,9,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.fillText(coins,42,68);
  ctx.textAlign='right';ctx.font='14px sans-serif';ctx.fillText(muted?'SOUND OFF (M)':'SOUND ON (M)',W-14,28);
  ctx.fillText('BEST '+best,W-14,50);
  ctx.shadowBlur=0;
  // police distance bar
  ctx.textAlign='left';ctx.font='bold 12px sans-serif';ctx.fillStyle='#fff';ctx.fillText('POLICE',16,92);
  ctx.fillStyle='#0008';ctx.fillRect(66,82,120,10);
  ctx.fillStyle=gap<.4?'#ff3b3b':gap<.7?'#ffb02e':'#4cd964';ctx.fillRect(66,82,120*gap,10);
  if(gap<.5&&state==='play'&&Math.floor(time*6)%2){ctx.fillStyle='#ff3b3b';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText('DANGER!',W/2,120);}
}
function overlay(title,lines){
  ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=10;
  ctx.fillStyle='#ffd1f0';ctx.font='bold 54px sans-serif';ctx.fillText(title,W/2,250);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  lines.forEach((l,i)=>ctx.fillText(l,W/2,310+i*32));
  ctx.shadowBlur=0;
}
function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*12,(Math.random()-.5)*12);
  drawBackground();drawRoad();
  const list=obs.filter(o=>o.z>-F+20).sort((a,b)=>b.z-a.z);
  for(const o of list)drawObj(o);
  // characters
  const air=player.y>2,sl=player.slide>0&&!air;
  const[px,py]=P(player.x,player.y,0);
  const lag=state==='menu'?0:(player.x*.85);
  const os=1.0+.2*(1-gap);
  const oyy=770+100*gap;
  drawPrincess(px,py,1,runPh,air,sl);
  drawOfficer(W/2+lag*1.1,oyy,os*.95,runPh+1.5,gap<.5);
  ctx.restore();
  if(state==='play')drawHUD();
  if(state==='menu'){
    overlay('PRINCESS RUN',['Escape the police officer!','','Swipe or arrow keys: move / jump / dive','Tap or press SPACE to start','',best?('Best score: '+best):'']);
  }else if(state==='over'&&overT>.8){
    overlay('CAUGHT!',['Score: '+score+'   Coins: '+coins,'Best: '+best,'','Tap or press SPACE to run again']);
  }
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------------- INPUT ---------------- */
function action(a){
  if(state==='menu'||(state==='over'&&overT>.8)){if(a==='start'||a==='up')start();return;}
  if(a==='left')moveLane(-1);else if(a==='right')moveLane(1);
  else if(a==='up')jump();else if(a==='down')dive();
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();
  if(k==='m'){toggleMute();return;}
  initAudio();
  if(k==='arrowleft'||k==='a')action('left');
  else if(k==='arrowright'||k==='d')action('right');
  else if(k==='arrowup'||k==='w'||k===' ')action('up');
  else if(k==='arrowdown'||k==='s')action('down');
  else if(k==='enter')action('start');
});
let tx=0,ty=0,tt=0;
cv.addEventListener('touchstart',e=>{e.preventDefault();initAudio();const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;tt=performance.now();},{passive:false});
cv.addEventListener('touchend',e=>{
  e.preventDefault();const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)<25&&Math.abs(dy)<25){
    const r=cv.getBoundingClientRect();
    if((t.clientY-r.top)<60&&(t.clientX-r.left)>r.width*.6){toggleMute();return;}
    action('start');return;
  }
  if(Math.abs(dx)>Math.abs(dy))action(dx>0?'right':'left');else action(dy>0?'down':'up');
},{passive:false});
cv.addEventListener('mousedown',e=>{
  initAudio();
  const r=cv.getBoundingClientRect();
  if((e.clientY-r.top)<60&&(e.clientX-r.left)>r.width*.6){toggleMute();return;}
  if(state!=='play')action('start');
});
</script>
</body>
